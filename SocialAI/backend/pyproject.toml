[project]
name = "postpilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1", "uvicorn[standard]>=0.38,<1",
  "sqlalchemy>=2.0.44,<2.1", "alembic>=1.17,<2",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.11,<3",
  "email-validator>=2.3,<3", "pwdlib[argon2]>=0.3,<1",
  "httpx>=0.28,<1", "tzdata>=2025.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
