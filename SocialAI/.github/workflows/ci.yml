name: PostPilot CI
permissions:
  contents: read
on:
  push:
    paths: ['SocialAI/**', '.github/workflows/**']
  pull_request:
    paths: ['SocialAI/**', '.github/workflows/**']
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SocialAI/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postpilot
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: postpilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postpilot -d postpilot_test'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postpilot:ci-only-disposable@localhost:5432/postpilot_test
      TEST_DATABASE_URL: postgresql+psycopg://postpilot:ci-only-disposable@localhost:5432/postpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.lock -e '.[dev]'
      - run: python -m ruff check app tests migrations
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
      - run: python -m pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SocialAI/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SocialAI/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv ../backend/.venv
      - run: ../backend/.venv/bin/python -m pip install -r ../backend/requirements.lock -e '../backend[dev]'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: SocialAI/frontend/test-results
